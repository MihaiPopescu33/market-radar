name: scan
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salveaza jurnalul
        run: |
          git config user.name "market-radar"
          git config user.email "radar@users.noreply.github.com"
          git add state.json journal.csv
          git diff --cached --quiet || (git commit -m "radar: update" && git pull --rebase && git push)
