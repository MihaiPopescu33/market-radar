name: report
on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py report
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salveaza raportul
        run: |
          git config user.name "market-radar"
          git config user.email "radar@users.noreply.github.com"
          git add reports/backtest.md
          git diff --cached --quiet || (git commit -m "radar: raport" && git pull --rebase && git push)
